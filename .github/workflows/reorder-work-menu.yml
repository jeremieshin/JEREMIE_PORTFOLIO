name: Reorder Work menu filters

on:
  push:
    paths:
      - '.github/workflows/reorder-work-menu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put Promotion before Project in Work filters
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\n?<script id="jeremie-work-filter-order">.*?</script>\n?', '\n', s, flags=re.S)
          js = r'''<script id="jeremie-work-filter-order">(()=>{const run=()=>{const buttons=[...document.querySelectorAll('.filter-btn')];const promotion=buttons.find(b=>b.textContent.trim().toLowerCase()==='promotion');const project=buttons.find(b=>b.textContent.trim().toLowerCase()==='project');if(!promotion||!project)return;const parent=promotion.parentElement;if(parent&&project.parentElement===parent){parent.insertBefore(promotion,project)}};document.readyState==='loading'?document.addEventListener('DOMContentLoaded',run):run()})();</script>'''
          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reorder Work menu filters"
          git push
