name: Refine portfolio interactions

on:
  push:
    paths:
      - '.github/workflows/work-card-hover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply theme and menu interaction refinements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          marker = '</style>'

          css = '''
  /* INTERACTION refinements */
  body,
  .hero,
  .hero-title-img,
  .topbar,
  .burger,
  .menu-overlay,
  .menu-close{
    transition:background-color .45s cubic-bezier(.16,.8,.24,1),
               color .45s cubic-bezier(.16,.8,.24,1),
               border-color .45s cubic-bezier(.16,.8,.24,1),
               filter .55s cubic-bezier(.16,.8,.24,1),
               transform .55s cubic-bezier(.16,.8,.24,1);
  }

  /* Make the closed-page theme visibly follow the selected mode. */
  .topbar{mix-blend-mode:normal !important;}
  body.inverted .hero-title-img{
    filter:invert(1) hue-rotate(180deg) brightness(1.04);
  }
  body.inverted .hero{
    background:#faf9f6 !important;
  }

  /* Unified square menu controls. */
  .burger,
  .menu-close{
    width:40px !important;
    height:40px !important;
    border:1px solid currentColor !important;
    border-radius:0 !important;
    background:transparent !important;
    display:flex !important;
    align-items:center !important;
    justify-content:center !important;
    color:var(--ink-on-dark) !important;
    overflow:hidden;
  }
  .menu-close{
    color:var(--ink-on-light) !important;
  }
  .burger{
    position:relative;
    gap:5px !important;
    transform:rotate(0deg);
  }
  .burger span{
    width:18px !important;
    height:1.5px !important;
    background:currentColor !important;
    transform-origin:center;
    transition:transform .45s cubic-bezier(.16,.8,.24,1), opacity .25s ease !important;
  }
  .burger.open{
    transform:rotate(90deg);
  }
  .burger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg) !important;}
  .burger.open span:nth-child(2){opacity:0 !important; transform:scaleX(.25) !important;}
  .burger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg) !important;}

  .menu-close svg{
    width:17px !important;
    height:17px !important;
    transition:transform .5s cubic-bezier(.16,.8,.24,1);
  }
  .menu-overlay.open .menu-close{
    animation:menuControlEnter .6s cubic-bezier(.16,.8,.24,1) both;
  }
  .menu-overlay.is-closing .menu-close{
    transform:rotate(90deg);
  }
  .menu-overlay.is-closing .menu-close svg{
    transform:rotate(-90deg) scale(.82);
  }
  @keyframes menuControlEnter{
    from{transform:rotate(-90deg); opacity:0;}
    to{transform:rotate(0deg); opacity:1;}
  }

  .burger:hover,
  .menu-close:hover{
    background:currentColor !important;
  }
  .burger:hover span{background:var(--dark) !important;}
  .menu-close:hover svg{color:var(--light);}

  body.inverted .burger{
    color:#333333 !important;
  }
  body:not(.inverted) .burger{
    color:#f3f1ea !important;
  }

  @media (prefers-reduced-motion: reduce){
    .burger,
    .menu-close,
    .menu-close svg,
    .menu-overlay,
    .hero-title-img{transition:none !important; animation:none !important;}
  }
'''

          start = '  /* INTERACTION refinements */'
          if start in text:
              before, rest = text.split(start, 1)
              rest = rest.split(marker, 1)[1]
              text = before + css + marker + rest
          else:
              text = text.replace(marker, css + marker, 1)

          old_js = """function openMenu(){ menu.classList.add('open'); burger.classList.add('open'); }\nfunction closeMenu(){ menu.classList.remove('open'); burger.classList.remove('open'); }\nburger.addEventListener('click', () => { menu.classList.contains('open') ? closeMenu() : openMenu(); });\nmenuClose.addEventListener('click', closeMenu);"""

          new_js = """function openMenu(){\n  menu.classList.remove('is-closing');\n  burger.classList.add('open');\n  requestAnimationFrame(() => menu.classList.add('open'));\n}\nfunction closeMenu(){\n  menu.classList.add('is-closing');\n  burger.classList.remove('open');\n  setTimeout(() => {\n    menu.classList.remove('open');\n    menu.classList.remove('is-closing');\n  }, 280);\n}\nburger.addEventListener('click', () => { menu.classList.contains('open') ? closeMenu() : openMenu(); });\nmenuClose.addEventListener('click', closeMenu);"""

          if old_js in text:
              text = text.replace(old_js, new_js, 1)

          path.write_text(text)
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add theme-aware rotating menu controls"
          git push
