name: Refine work cards

on:
  push:
    paths:
      - '.github/workflows/work-card-hover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine work layout and hover
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          marker = '</style>'
          css = '''
  /* WORK refinements */
  .work-layout{
    display:grid !important;
    grid-template-columns:minmax(240px,.72fr) minmax(0,1.55fr) !important;
    gap:56px !important;
    align-items:start !important;
    width:100%;
  }
  .filters{min-width:0;width:100%;}
  .grid{
    display:grid !important;
    grid-template-columns:repeat(3,minmax(0,1fr)) !important;
    gap:14px !important;
    width:100%;
    min-width:0;
    align-items:start;
  }
  .tile{
    width:100%;
    min-width:0;
    aspect-ratio:3/5;
    overflow:hidden;
    transform:none !important;
  }
  .tile::after{display:none !important;}
  .tile-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background-size:cover !important;
    background-position:center center !important;
    transform:scale(1) !important;
    transform-origin:center center;
    transition:transform .75s cubic-bezier(.16,.8,.24,1) !important;
    filter:none !important;
    will-change:transform;
  }
  .tile:hover .tile-bg{
    transform:scale(1.08) !important;
    filter:none !important;
  }
  .tile .tag{position:relative;z-index:2;}

  @media(max-width:1200px){
    .work-layout{
      grid-template-columns:minmax(220px,.65fr) minmax(0,1.35fr) !important;
      gap:40px !important;
    }
    .grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}
  }
  @media(max-width:900px){
    .work-layout{display:block !important;}
    .filters{
      position:static !important;
      height:auto !important;
      display:flex !important;
      flex-direction:row !important;
      flex-wrap:wrap;
      gap:16px !important;
      margin-bottom:32px;
    }
    .grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}
  }
  @media(max-width:600px){
    .grid{grid-template-columns:1fr !important;}
  }
'''

          start = '  /* WORK refinements */'
          if start in text:
              before, rest = text.split(start, 1)
              rest = rest.split(marker, 1)[1]
              text = before + css + marker + rest
          else:
              text = text.replace(marker, css + marker, 1)

          path.write_text(text)
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine work grid and inner image hover"
          git push
