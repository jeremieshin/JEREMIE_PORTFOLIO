name: Add subtle work card hover interaction

on:
  push:
    paths:
      - '.github/workflows/work-card-hover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-hover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update work card hover interaction
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          old_css = '''  .tile{\n    position:relative; aspect-ratio:3/5; border-radius:6px; overflow:hidden;\n    display:flex; align-items:flex-end; padding:16px;\n    cursor:pointer; transition:transform .4s var(--ease);\n  }\n  .tile:hover{ transform:translateY(-4px); }\n  .tile .tag{\n    font-family:'Pretendard Variable'; font-weight:700; font-size:14px; line-height:1.15;\n    color:#fff; text-shadow:0 2px 12px rgba(0,0,0,0.25);\n  }\n'''

          new_css = '''  .tile{\n    position:relative; aspect-ratio:3/5; border-radius:6px; overflow:hidden;\n    display:flex; align-items:flex-end; padding:16px;\n    cursor:pointer;\n  }\n  .tile-bg{\n    position:absolute; inset:0;\n    background-size:cover; background-position:center;\n    transform:scale(1);\n    transition:transform .65s var(--ease), filter .45s ease;\n    will-change:transform;\n  }\n  .tile::after{\n    content:''; position:absolute; inset:0; pointer-events:none;\n    background:linear-gradient(120deg, transparent 28%, rgba(255,255,255,.10) 48%, transparent 68%);\n    transform:translateX(-120%);\n    transition:transform .7s var(--ease);\n  }\n  .tile:hover .tile-bg{ transform:scale(1.035); filter:saturate(1.04) brightness(1.025); }\n  .tile:hover::after{ transform:translateX(120%); }\n  .tile .tag{\n    position:relative; z-index:2;\n    font-family:'Pretendard Variable'; font-weight:700; font-size:14px; line-height:1.15;\n    color:#fff; text-shadow:0 2px 12px rgba(0,0,0,0.25);\n  }\n'''

          if old_css not in text:
              raise SystemExit('Expected tile CSS block not found')
          text = text.replace(old_css, new_css, 1)

          old_render = '''    const bg = p.image\n      ? `background-image:url('${p.image}'); background-size:cover; background-position:center;`\n      : `background:linear-gradient(135deg, ${p.from}, ${p.to});`;\n    const textColor = p.dark ? 'color:#141414;' : '';\n    return `<div class="tile" data-cat="${p.category}" style="${bg}">\n      <span class="tag" style="${textColor}">${p.title}</span>\n    </div>`;\n'''

          new_render = '''    const bg = p.image\n      ? `background-image:url('${p.image}');`\n      : `background:linear-gradient(135deg, ${p.from}, ${p.to});`;\n    const textColor = p.dark ? 'color:#141414;' : '';\n    return `<div class="tile" data-cat="${p.category}">\n      <div class="tile-bg" style="${bg}"></div>\n      <span class="tag" style="${textColor}">${p.title}</span>\n    </div>`;\n'''

          if old_render not in text:
              raise SystemExit('Expected renderGrid block not found')
          text = text.replace(old_render, new_render, 1)

          path.write_text(text)
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add subtle hover interaction to work cards"
          git push
