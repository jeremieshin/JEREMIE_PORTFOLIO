name: Recover index and refine Work typography

on:
  push:
    paths:
      - '.github/workflows/recover-index-and-work-type.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good index and apply requested Work typography
        run: |
          git show f28cd672c7f854c7fbe3858ccff2da981d062acd:index.html > index.html
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          # Work filter typography: 10% smaller and weight 800.
          s = s.replace("font-family:'Pretendard Variable'; font-weight:700;\n    font-size:clamp(45px, 7.2vw, 120px);", "font-family:'Pretendard Variable'; font-weight:800;\n    font-size:clamp(40.5px, 6.48vw, 108px);")

          # Preserve the requested blue-to-purple active accent.
          accent = r'''
  /* BLUE PURPLE ACTIVE ACCENT */
  :root{
    --accent-gradient:linear-gradient(90deg,#16a7e8 0%,#367ee8 48%,#8a38e8 100%);
  }
  .filter-btn.active,
  .menu-nav a:hover{
    color:transparent !important;
    background:var(--accent-gradient);
    -webkit-background-clip:text;
    background-clip:text;
  }
'''
          s = re.sub(r'\n?  /\* BLUE PURPLE ACTIVE ACCENT \*/.*?(?=</style>)', '\n', s, flags=re.S)
          s = s.replace('</style>', accent + '\n</style>', 1)
          p.write_text(s)
          PY
      - name: Commit restored page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Recover page and refine Work menu typography"
          git push
