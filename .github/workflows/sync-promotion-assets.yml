name: Recover page and sync Promotion assets

on:
  push:
    paths:
      - '*.png'
      - '.github/workflows/sync-promotion-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover page if needed and render uploaded Promotion cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json, unicodedata, subprocess

          p = Path('index.html')
          if (not p.exists()) or p.stat().st_size < 1000:
              good = subprocess.check_output(['git','show','cf626515a0475561a94b45c28aa12b633de3351d:index.html'])
              p.write_bytes(good)

          s = p.read_text(encoding='utf-8')
          root = Path('.')
          card_re = re.compile(r'^(\d{8})_Promotion_(.+)_card\.png$', re.I)
          detail_re = re.compile(r'^(\d{8})_Promotion_(.+)_detail\.png$', re.I)
          cards, details = {}, {}
          for f in root.glob('*.png'):
              n = unicodedata.normalize('NFC', f.name)
              m = card_re.match(n)
              if m:
                  cards[(m.group(1),m.group(2))] = f.name
                  continue
              m = detail_re.match(n)
              if m:
                  details[(m.group(1),m.group(2))] = f.name

          items=[]
          for key,card in cards.items():
              date,name=key
              items.append({'date':date,'name':name,'card':card,'detail':details.get(key,'')})
          items.sort(key=lambda x:(x['date'],x['name']), reverse=True)
          payload=json.dumps(items,ensure_ascii=False)

          # Remove obsolete Promotion patches that hard-code seven placeholder cards.
          for sid in ['jeremie-promotion-only-fix','jeremie-promotion-assets','jeremie-promotion-final']:
              s=re.sub(r'\n?<script id="'+re.escape(sid)+r'">.*?</script>\n?','\n',s,flags=re.S)

          # Use the uploaded main visual directly.
          s=re.sub(r'<img([^>]*class="[^"]*hero-title-img[^"]*"[^>]*)src="[^"]*"([^>]*)>',
                   lambda m:'<img'+m.group(1)+'src="260821_main.png"'+m.group(2)+'>',s,count=1,flags=re.I)

          css='''
<style id="jeremie-promotion-final-style">
.hero{background:#000000 !important;}
.hero-title-img{object-fit:contain !important;object-position:center center !important;scale:.8 !important;transform-origin:center center !important;}
.work-grid,.grid{background:inherit;}
.tile{border-radius:0 !important;overflow:hidden !important;box-shadow:none !important;cursor:pointer;}
.tile .tile-bg{position:absolute !important;inset:0 !important;background-size:cover !important;background-position:center !important;background-repeat:no-repeat !important;border-radius:0 !important;transition:inset .2s cubic-bezier(.2,.7,.2,1),transform .2s cubic-bezier(.2,.7,.2,1) !important;}
.tile:hover .tile-bg{inset:14px !important;transform:scale(1.035) !important;}
</style>
'''
          s=re.sub(r'\n?<style id="jeremie-promotion-final-style">.*?</style>\n?','\n',s,flags=re.S)
          s=s.replace('</head>',css+'\n</head>',1)

          js=f'''<script id="jeremie-promotion-final">(()=>{{
const ITEMS={payload};
let rendered=false;
const grid=()=>document.querySelector('.work-grid,.grid');
const promo=()=>[...document.querySelectorAll('.filter-btn')].find(b=>b.textContent.trim().toUpperCase()==='PROMOTION');
const openDetail=src=>{{if(!src)return;let o=document.getElementById('jeremie-detail-overlay');if(!o){{o=document.createElement('div');o.id='jeremie-detail-overlay';o.style.cssText='position:fixed;inset:0;z-index:99999;background:#000;overflow:auto;display:none';o.innerHTML='<button type="button" aria-label="close" style="position:fixed;right:24px;top:18px;z-index:2;border:0;background:transparent;color:#fff;font-size:36px;cursor:pointer">×</button><img style="display:block;width:100%;height:auto;margin:0 auto">';o.querySelector('button').onclick=()=>{{o.style.display='none';document.body.style.overflow=''}};document.body.appendChild(o)}}o.querySelector('img').src=encodeURI(src);o.style.display='block';o.scrollTop=0;document.body.style.overflow='hidden'}};
const render=()=>{{const g=grid();if(!g)return;g.innerHTML='';ITEMS.forEach(item=>{{const t=document.createElement('div');t.className='tile';t.dataset.cat='promotion';t.dataset.category='promotion';const bg=document.createElement('div');bg.className='tile-bg';bg.style.backgroundImage=`url("${{encodeURI(item.card)}}")`;t.appendChild(bg);t.onclick=e=>{{e.preventDefault();openDetail(item.detail)}};g.appendChild(t)}});rendered=true;window.dispatchEvent(new Event('resize'))}};
const init=()=>{{const b=promo();if(b){{b.addEventListener('click',()=>requestAnimationFrame(render));if(b.classList.contains('active'))render();}}else render();setTimeout(()=>{{if(!rendered)render()}},250)}};
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',init):init();
}})();</script>'''
          if '</body>' not in s: raise SystemExit('Recovered page has no body close')
          s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          print('Promotion cards:',len(items))
          PY
      - name: Commit repaired page
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Recover page and render all Promotion assets"
          git push
