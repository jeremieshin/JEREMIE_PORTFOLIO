name: Apply safe portfolio patch
on:
  push:
    paths:
      - 'patch_portfolio.py'
      - '.github/workflows/apply-safe-portfolio-patch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing index without replacing its structure
        run: python patch_portfolio.py
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Safely apply portfolio UI refinements"
          git push
