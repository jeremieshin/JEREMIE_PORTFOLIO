name: Apply hero fullscreen update

on:
  push:
    paths:
      - '.github/workflows/hero-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hero image layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text()
          pattern = r"  \.hero-title-img\{\n(?:.*\n)*?  \}\n"
          replacement = """  .hero-title-img{\n    position:absolute; inset:0;\n    width:100%; height:100%;\n    object-fit:cover; object-position:center center;\n    transform:none; z-index:1; display:block;\n  }\n"""
          updated, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'hero-title-img block not found exactly once: {count}')
          path.write_text(updated)
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make hero image fill viewport"
          git push
