name: Reduce hero image size

on:
  push:
    paths:
      - '.github/workflows/reduce-hero-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scale only the actual main visual to 80 percent
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove every previous hero patch that could override position/transform.
          s = re.sub(r'\n?<style id="jeremie-hero-size">.*?</style>\n?', '\n', s, flags=re.S)
          s = re.sub(r'\n?<script id="jeremie-hero-center">.*?</script>\n?', '\n', s, flags=re.S)
          s = re.sub(r'\n?<script id="jeremie-hero-scale80">.*?</script>\n?', '\n', s, flags=re.S)

          js = r'''<script id="jeremie-hero-scale80">(()=>{
          const applyHeroScale=()=>{
            const title=document.querySelector('.hero-title-img');
            if(!title)return;

            let section=title.closest('section');
            if(!section){
              let node=title.parentElement;
              while(node&&node!==document.body){
                const r=node.getBoundingClientRect();
                if(r.width>=innerWidth*.85&&r.height>=innerHeight*.70){section=node;break}
                node=node.parentElement;
              }
            }
            if(!section)return;

            // Only change the requested background. Preserve all existing layout values.
            section.style.setProperty('background-color','#000000','important');

            // Find the same large hero visual, but DO NOT touch its position or transform.
            const candidates=[...section.querySelectorAll('img,canvas,video,svg')].filter(el=>{
              if(el===title||title.contains(el)||el.contains(title))return false;
              const r=el.getBoundingClientRect();
              return r.width>320&&r.height>220;
            });
            if(!candidates.length)return;

            const media=candidates.sort((a,b)=>{
              const ar=a.getBoundingClientRect(), br=b.getBoundingClientRect();
              return (br.width*br.height)-(ar.width*ar.height);
            })[0];

            // Scale from the visual's own center. CSS individual scale preserves any existing transform.
            media.style.setProperty('scale','.8','important');
            media.style.setProperty('transform-origin','center center','important');
          };

          const schedule=()=>requestAnimationFrame(()=>requestAnimationFrame(applyHeroScale));
          document.readyState==='loading'?document.addEventListener('DOMContentLoaded',schedule):schedule();
          window.addEventListener('load',applyHeroScale,{once:true});
          })();</script>'''

          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix hero image at 80 percent without layout overrides"
          git push
