name: Reduce hero image size

on:
  push:
    paths:
      - '.github/workflows/reduce-hero-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center only the main hero image and match background
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\n?<style id="jeremie-hero-size">.*?</style>\n?', '\n', s, flags=re.S)
          css = r'''<style id="jeremie-hero-size">
          .hero{
            position:relative!important;
            background:#000000!important;
            overflow:hidden!important;
          }
          .hero-title-img{
            position:absolute!important;
            left:50%!important;
            top:50%!important;
            width:70%!important;
            max-width:70%!important;
            height:auto!important;
            display:block!important;
            margin:0!important;
            transform:translate(-50%,-50%)!important;
            transform-origin:center center!important;
          }
          </style>'''
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Center hero image and match black background"
          git push
