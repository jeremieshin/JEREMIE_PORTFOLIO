name: Match Work filter typography to overlay menu

on:
  push:
    paths:
      - '.github/workflows/match-work-filter-typography.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uppercase Work filters and enlarge another 10 percent
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\n?<script id="jeremie-work-typography-match">.*?</script>\n?', '\n', s, flags=re.S)
          js = r'''<script id="jeremie-work-typography-match">(()=>{const apply=()=>{const source=document.querySelector('.menu-overlay .menu-link,.menu-overlay .menu-nav a');if(source){const cs=getComputedStyle(source);const base=parseFloat(cs.fontSize);document.querySelectorAll('.filter-btn').forEach(btn=>{btn.textContent=btn.textContent.trim().toUpperCase();btn.style.setProperty('font-size',(base*1.32)+'px','important');btn.style.setProperty('letter-spacing',cs.letterSpacing,'important');btn.style.setProperty('line-height','1.08','important')})}const sidebar=document.querySelector('.work-sidebar');const grid=document.querySelector('.work-grid');if(sidebar&&grid&&window.innerWidth>900){sidebar.style.setProperty('position','relative','important');sidebar.style.setProperty('z-index','3','important');grid.style.setProperty('position','relative','important');grid.style.setProperty('z-index','1','important');grid.style.setProperty('margin-left','-7vw','important');grid.style.setProperty('width','calc(100% + 7vw)','important')}else if(grid){grid.style.removeProperty('margin-left');grid.style.removeProperty('width')}};document.readyState==='loading'?document.addEventListener('DOMContentLoaded',apply):apply();window.addEventListener('resize',apply)})();</script>'''
          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Uppercase and enlarge Work filters"
          git push
