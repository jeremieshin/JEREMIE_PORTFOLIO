name: Match Work filter typography to overlay menu

on:
  push:
    paths:
      - '.github/workflows/match-work-filter-typography.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stabilize Work layout and recorded hover interaction
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\n?<script id="jeremie-work-typography-match">.*?</script>\n?', '\n', s, flags=re.S)
          js = r'''<script id="jeremie-work-typography-match">(()=>{const CARD_W=262;const CARD_RATIO=1.56;const GAP=14;const apply=()=>{const source=document.querySelector('.menu-overlay .menu-link,.menu-overlay .menu-nav a');if(source){const cs=getComputedStyle(source);const base=parseFloat(cs.fontSize);document.querySelectorAll('.filter-btn').forEach(btn=>{btn.textContent=btn.textContent.trim().toUpperCase();btn.style.setProperty('font-size',(base*1.32)+'px','important');btn.style.setProperty('letter-spacing',cs.letterSpacing,'important');btn.style.setProperty('line-height','1.04','important');btn.style.setProperty('margin','0 0 8px 0','important');btn.style.setProperty('white-space','nowrap','important');btn.style.setProperty('overflow','visible','important');btn.style.setProperty('max-width','none','important');btn.style.setProperty('width','max-content','important');btn.style.setProperty('display','block','important');btn.style.setProperty('transform-origin','left center','important');btn.style.setProperty('transition','transform .28s cubic-bezier(.2,.7,.2,1)','important');if(!btn.dataset.jeremieMenuHover){btn.dataset.jeremieMenuHover='1';btn.addEventListener('mouseenter',()=>btn.style.setProperty('transform','scale(.92)','important'));btn.addEventListener('mouseleave',()=>btn.style.setProperty('transform','scale(1)','important'))}})}const work=document.querySelector('.work');const layout=document.querySelector('.work-layout');const sidebar=document.querySelector('.work-sidebar,.filters');const grid=document.querySelector('.work-grid,.grid');if(!grid)return;if(work){work.style.setProperty('background','#fff','important')}if(layout){layout.style.setProperty('background','#fff','important')}if(sidebar){sidebar.style.setProperty('background','#fff','important')}grid.style.setProperty('background','#fff','important');if(window.innerWidth>900){if(work){work.style.setProperty('padding-left','40px','important');work.style.setProperty('padding-right','50px','important');work.style.setProperty('overflow','visible','important')}if(layout){layout.style.setProperty('gap','0','important');layout.style.setProperty('position','relative','important');layout.style.setProperty('overflow','visible','important')}if(sidebar){sidebar.style.setProperty('position','sticky','important');sidebar.style.setProperty('top','0','important');sidebar.style.setProperty('z-index','3','important');sidebar.style.setProperty('flex','0 0 430px','important');sidebar.style.setProperty('width','430px','important');sidebar.style.setProperty('min-width','430px','important');sidebar.style.setProperty('overflow','visible','important')}grid.style.setProperty('position','relative','important');grid.style.setProperty('z-index','1','important');grid.style.setProperty('display','grid','important');grid.style.setProperty('grid-template-columns',`repeat(auto-fit, ${CARD_W}px)`,'important');grid.style.setProperty('grid-auto-columns',`${CARD_W}px`,'important');grid.style.setProperty('grid-auto-rows','auto','important');grid.style.setProperty('gap',`${GAP}px`,'important');grid.style.setProperty('justify-content','start','important');grid.style.setProperty('align-content','start','important');grid.style.setProperty('flex','1 1 auto','important');grid.style.setProperty('min-width','0','important');grid.style.setProperty('margin-left',`${CARD_W+GAP-120}px`,'important');grid.style.setProperty('margin-right','0','important');grid.style.setProperty('width','auto','important')}document.querySelectorAll('.tile').forEach((tile,i)=>{tile.style.setProperty('width',`${CARD_W}px`,'important');tile.style.setProperty('min-width',`${CARD_W}px`,'important');tile.style.setProperty('max-width',`${CARD_W}px`,'important');tile.style.setProperty('height',`${Math.round(CARD_W*CARD_RATIO)}px`,'important');tile.style.setProperty('min-height',`${Math.round(CARD_W*CARD_RATIO)}px`,'important');tile.style.setProperty('max-height',`${Math.round(CARD_W*CARD_RATIO)}px`,'important');tile.style.setProperty('aspect-ratio','auto','important');tile.style.setProperty('overflow','hidden','important');tile.style.setProperty('position','relative','important');tile.style.setProperty('box-sizing','border-box','important');tile.style.setProperty('flex','0 0 auto','important');tile.style.setProperty('background','#fff','important');tile.style.setProperty('box-shadow','none','important');tile.style.setProperty('border-radius','0','important');const bg=tile.querySelector('.tile-bg');if(bg){bg.style.setProperty('position','absolute','important');bg.style.setProperty('inset','0','important');bg.style.setProperty('width','auto','important');bg.style.setProperty('height','auto','important');bg.style.setProperty('background-size','cover','important');bg.style.setProperty('background-position','center','important');bg.style.setProperty('border-radius','0','important');bg.style.setProperty('transition','transform .32s cubic-bezier(.2,.7,.2,1)','important');bg.style.setProperty('transform-origin','center center','important');if(i>=7){bg.style.setProperty('background-image','none','important');bg.style.setProperty('background-color','#fff','important')}}const img=tile.querySelector('img');if(img){img.style.setProperty('position','absolute','important');img.style.setProperty('inset','0','important');img.style.setProperty('width','100%','important');img.style.setProperty('height','100%','important');img.style.setProperty('object-fit','cover','important');img.style.setProperty('border-radius','0','important');img.style.setProperty('transition','transform .32s cubic-bezier(.2,.7,.2,1)','important');img.style.setProperty('transform-origin','center center','important')}if(i>=7&&!bg&&!img){tile.querySelectorAll(':scope > *').forEach(child=>{if(!child.classList.contains('tile-title'))child.style.setProperty('background','#fff','important')})}if(!tile.dataset.jeremieHover){tile.dataset.jeremieHover='1';tile.addEventListener('mouseenter',()=>{if(bg)bg.style.setProperty('transform','scale(1.035)','important');if(img)img.style.setProperty('transform','scale(1.035)','important')});tile.addEventListener('mouseleave',()=>{if(bg)bg.style.setProperty('transform','scale(1)','important');if(img)img.style.setProperty('transform','scale(1)','important')})}})};const bind=()=>{apply();document.querySelectorAll('.filter-btn').forEach(btn=>{if(btn.dataset.jeremieLayoutBind)return;btn.dataset.jeremieLayoutBind='1';btn.addEventListener('click',()=>requestAnimationFrame(()=>requestAnimationFrame(apply)))})};document.readyState==='loading'?document.addEventListener('DOMContentLoaded',bind):bind();window.addEventListener('resize',apply)})();</script>'''
          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove card rounding and white hover frame"
          git push
