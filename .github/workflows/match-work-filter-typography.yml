name: Match Work filter typography to overlay menu

on:
  push:
    paths:
      - '.github/workflows/match-work-filter-typography.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep Work cards fixed-size and add inset hover interaction
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\n?<script id="jeremie-work-typography-match">.*?</script>\n?', '\n', s, flags=re.S)
          js = r'''<script id="jeremie-work-typography-match">(()=>{const apply=()=>{const source=document.querySelector('.menu-overlay .menu-link,.menu-overlay .menu-nav a');if(source){const cs=getComputedStyle(source);const base=parseFloat(cs.fontSize);document.querySelectorAll('.filter-btn').forEach(btn=>{btn.textContent=btn.textContent.trim().toUpperCase();btn.style.setProperty('font-size',(base*1.32)+'px','important');btn.style.setProperty('letter-spacing',cs.letterSpacing,'important');btn.style.setProperty('line-height','1.08','important')})}const work=document.querySelector('.work');const layout=document.querySelector('.work-layout');const sidebar=document.querySelector('.work-sidebar,.filters');const grid=document.querySelector('.work-grid,.grid');if(!grid)return;if(window.innerWidth>900){if(work){work.style.setProperty('padding-left','40px','important');work.style.setProperty('padding-right','40px','important')}if(layout){layout.style.setProperty('gap','0','important');layout.style.setProperty('position','relative','important')}if(sidebar){sidebar.style.setProperty('position','sticky','important');sidebar.style.setProperty('top','0','important');sidebar.style.setProperty('z-index','3','important');sidebar.style.setProperty('flex','0 0 360px','important');sidebar.style.setProperty('width','360px','important')}grid.style.setProperty('position','relative','important');grid.style.setProperty('z-index','1','important');grid.style.setProperty('display','grid','important');grid.style.setProperty('grid-template-columns','repeat(auto-fit, 262px)','important');grid.style.setProperty('grid-auto-rows','auto','important');grid.style.setProperty('gap','14px','important');grid.style.setProperty('justify-content','end','important');grid.style.setProperty('align-content','start','important');grid.style.setProperty('flex','1 1 auto','important');grid.style.setProperty('min-width','0','important');grid.style.setProperty('margin-left','-120px','important');grid.style.setProperty('width','auto','important');document.querySelectorAll('.tile').forEach(tile=>{tile.style.setProperty('width','262px','important');tile.style.setProperty('min-width','262px','important');tile.style.setProperty('max-width','262px','important')})}else{if(work){work.style.removeProperty('padding-left');work.style.removeProperty('padding-right')}if(layout){layout.style.removeProperty('gap');layout.style.removeProperty('position')}if(sidebar){sidebar.style.removeProperty('position');sidebar.style.removeProperty('top');sidebar.style.removeProperty('z-index');sidebar.style.removeProperty('flex');sidebar.style.removeProperty('width')}grid.style.removeProperty('grid-template-columns');grid.style.removeProperty('grid-auto-rows');grid.style.removeProperty('justify-content');grid.style.removeProperty('align-content');grid.style.removeProperty('flex');grid.style.removeProperty('min-width');grid.style.removeProperty('margin-left');grid.style.removeProperty('width');document.querySelectorAll('.tile').forEach(tile=>{tile.style.removeProperty('width');tile.style.removeProperty('min-width');tile.style.removeProperty('max-width')})}document.querySelectorAll('.tile').forEach(tile=>{tile.style.setProperty('overflow','hidden','important');tile.style.setProperty('position','relative','important');tile.style.setProperty('box-sizing','border-box','important');tile.style.setProperty('transition','box-shadow .28s cubic-bezier(.2,.7,.2,1)','important');const img=tile.querySelector('img');if(img){img.style.setProperty('transition','transform .38s cubic-bezier(.2,.7,.2,1)','important');img.style.setProperty('transform-origin','center center','important')}if(!tile.dataset.jeremieHover){tile.dataset.jeremieHover='1';tile.addEventListener('mouseenter',()=>{tile.style.setProperty('box-shadow','inset 0 0 0 12px #fff','important');if(img)img.style.setProperty('transform','scale(1.035)','important')});tile.addEventListener('mouseleave',()=>{tile.style.setProperty('box-shadow','inset 0 0 0 0 #fff','important');if(img)img.style.setProperty('transform','scale(1)','important')})}})}};document.readyState==='loading'?document.addEventListener('DOMContentLoaded',apply):apply();window.addEventListener('resize',apply)})();</script>'''
          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add inset white card hover interaction"
          git push
