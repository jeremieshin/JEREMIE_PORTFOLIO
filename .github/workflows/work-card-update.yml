name: Apply first work card image

on:
  push:
    paths:
      - '.github/workflows/work-card-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link first work card image
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          old = '{ title: "Verdant Co.",  category: "project",   image: null, from: "#5b1620", to: "#7a2230" },'
          new = '{ title: "Verdant Co.",  category: "project",   image: "work_01.png", from: "#5b1620", to: "#7a2230" },'
          if old not in text:
              raise SystemExit('First project entry not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use uploaded image for first work card"
          git push
