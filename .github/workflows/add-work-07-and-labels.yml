name: Add work 07 and update labels

on:
  push:
    paths:
      - '.github/workflows/add-work-07-and-labels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add seventh card and update visible labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Update the safe-patch card setup from 6 to 7 cards.
          s = s.replace(".slice(0,6);cards.forEach", ".slice(0,7);cards.forEach")

          # Update existing project titles wherever they are stored in the source data.
          labels = [
              '2024 십일쩔어',
              '2023 우주쇼핑여행',
              '2023 블링블링 스프링 쇼핑',
              '2022 awesome',
              "2022 WHAT'S NEW",
              '2021 MERRY 11STREET',
              '2021 우주Like 우주패스',
          ]
          old_titles = ['Verdant Co.', 'Nightgrid', 'Solari', 'Terra Skin', 'Northfield', 'Wide Angle', 'Slow Hours']
          for old, new in zip(old_titles, labels):
              s = s.replace(f'title: "{old}"', f'title: "{new}"', 1)

          # Runtime safeguard: ensure first seven cards use the uploaded images,
          # correct labels, and detail-image mapping without changing other UI.
          marker_start = '<script id="jeremie-work-07-labels">'
          s = re.sub(r'\n?<script id="jeremie-work-07-labels">.*?</script>\n?', '\n', s, flags=re.S)
          js = r'''<script id="jeremie-work-07-labels">(()=>{const run=()=>{const grid=document.querySelector('.grid');if(!grid)return;const labels=['2024 십일쩔어','2023 우주쇼핑여행','2023 블링블링 스프링 쇼핑','2022 awesome',"2022 WHAT'S NEW",'2021 MERRY 11STREET','2021 우주Like 우주패스'];const cards=[...grid.querySelectorAll('.tile')].slice(0,7);cards.forEach((card,i)=>{const n=String(i+1).padStart(2,'0');card.dataset.workIndex=n;const bg=card.querySelector('.tile-bg');if(bg){bg.style.backgroundImage=`url('work_${n}_card.png')`;bg.style.backgroundSize='100% 100%';bg.style.backgroundPosition='center';bg.style.backgroundRepeat='no-repeat'}const candidates=[...card.querySelectorAll('.tile-title,.title,.tile-label,[class*="title"],[class*="label"]')];let el=candidates.find(x=>x.textContent.trim());if(!el){const texts=[...card.querySelectorAll('div,span,p')].filter(x=>x.children.length===0&&x.textContent.trim());el=texts[texts.length-1]}if(el)el.textContent=labels[i]});};document.readyState==='loading'?document.addEventListener('DOMContentLoaded',run):run()})();</script>'''
          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add seventh work card and update card labels"
          git push
