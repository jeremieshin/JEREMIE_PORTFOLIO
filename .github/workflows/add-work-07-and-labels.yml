name: Add work 07 and update labels

on:
  push:
    paths:
      - '.github/workflows/add-work-07-and-labels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force uploaded cards into Promotion only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          labels = ['2024 십일쩔어','2023 우주쇼핑여행','2023 블링블링 스프링 쇼핑','2022 awesome',"2022 WHAT'S NEW",'2021 MERRY 11STREET','2021 우주Like 우주패스']

          # Remove older runtime safeguard so there is one source of truth.
          s = re.sub(r'\n?<script id="jeremie-work-07-labels">.*?</script>\n?', '\n', s, flags=re.S)
          s = re.sub(r'\n?<script id="jeremie-promotion-only-fix">.*?</script>\n?', '\n', s, flags=re.S)

          # Runtime source of truth: first seven uploaded cards are Promotion only.
          js = r'''<script id="jeremie-promotion-only-fix">(()=>{const run=()=>{const grid=document.querySelector('.work-grid,.grid');if(!grid)return;const labels=['2024 십일쩔어','2023 우주쇼핑여행','2023 블링블링 스프링 쇼핑','2022 awesome',"2022 WHAT'S NEW",'2021 MERRY 11STREET','2021 우주Like 우주패스'];const cards=[...grid.querySelectorAll('.tile')];cards.slice(0,7).forEach((card,i)=>{const n=String(i+1).padStart(2,'0');card.dataset.workIndex=n;card.dataset.cat='promotion';card.setAttribute('data-category','promotion');const bg=card.querySelector('.tile-bg');if(bg){bg.style.backgroundImage=`url('work_${n}_card.png')`;bg.style.backgroundSize='100% 100%';bg.style.backgroundPosition='center';bg.style.backgroundRepeat='no-repeat'}const candidates=[...card.querySelectorAll('.tile-title,.title,.tile-label,[class*="title"],[class*="label"]')];let el=candidates.find(x=>x.textContent.trim());if(!el){const texts=[...card.querySelectorAll('div,span,p')].filter(x=>x.children.length===0&&x.textContent.trim());el=texts[texts.length-1]}if(el)el.textContent=labels[i]});const buttons=[...document.querySelectorAll('.filter-btn')];buttons.forEach(b=>b.classList.remove('active'));const promo=buttons.find(b=>(b.dataset.filter||'').toLowerCase()==='promotion');if(promo)promo.classList.add('active');const filter=(f)=>{const value=(f||'promotion').toLowerCase();cards.forEach((card,i)=>{const isUploaded=i<7;const cat=(card.dataset.cat||card.dataset.category||'').toLowerCase();const show=value==='all'||(value==='promotion'?isUploaded||cat==='promotion':!isUploaded&&cat===value);card.style.display=show?'flex':'none';card.style.opacity=show?'1':'0'})};buttons.forEach(btn=>{btn.onclick=(e)=>{e.preventDefault();buttons.forEach(b=>b.classList.remove('active'));btn.classList.add('active');filter(btn.dataset.filter)}});filter('promotion')};document.readyState==='loading'?document.addEventListener('DOMContentLoaded',run):run()})();</script>'''
          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Force uploaded Work cards into Promotion only"
          git push
