name: Apply portfolio refinements

on:
  push:
    paths:
      - '.github/workflows/final-refine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply theme menu and about refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text()

          css = r'''
  /* FINAL PORTFOLIO REFINEMENTS START */
  body,
  .hero,
  .work,
  .topbar,
  .burger,
  .menu-overlay,
  .menu-close,
  .about-section{
    transition:background-color .5s cubic-bezier(.16,.8,.24,1),
               color .5s cubic-bezier(.16,.8,.24,1),
               border-color .5s cubic-bezier(.16,.8,.24,1),
               filter .55s cubic-bezier(.16,.8,.24,1),
               transform .55s cubic-bezier(.16,.8,.24,1);
  }

  /* Same theme state now affects the closed page too. */
  body.inverted{background:#f4f2ed;color:#222;}
  body.inverted .hero{background:#f4f2ed !important;}
  body.inverted .hero-title-img{filter:invert(1) hue-rotate(180deg) brightness(1.02) contrast(.96);}
  body.inverted .topbar{color:#333 !important;mix-blend-mode:normal !important;}
  body.inverted .work{background:#151515 !important;color:#f3f1ea !important;}
  body.inverted .work .filter,
  body.inverted .work .filter-btn,
  body.inverted .work button{color:#f3f1ea !important;}
  body.inverted .work .filters,
  body.inverted .work .filter-row{border-color:rgba(255,255,255,.18) !important;}

  /* Matching square menu controls. */
  .burger,
  .menu-close{
    width:42px !important;
    height:42px !important;
    min-width:42px !important;
    min-height:42px !important;
    border:1px solid #333333 !important;
    border-radius:0 !important;
    background:transparent !important;
    box-sizing:border-box !important;
    display:flex !important;
    align-items:center !important;
    justify-content:center !important;
    overflow:hidden;
    padding:0 !important;
  }
  body:not(.inverted) .burger{border-color:#f3f1ea !important;}
  body.inverted .burger{border-color:#333333 !important;}
  .menu-close{border-color:#333333 !important;}

  .burger{gap:5px !important;transform:rotate(0deg);}
  .burger span{
    display:block !important;
    width:18px !important;
    height:1.5px !important;
    margin:0 !important;
    border:0 !important;
    background:currentColor !important;
    transform-origin:center center;
    transition:transform .48s cubic-bezier(.16,.8,.24,1),opacity .25s ease !important;
  }
  body:not(.inverted) .burger{color:#f3f1ea !important;}
  body.inverted .burger{color:#333333 !important;}
  .burger.is-active{transform:rotate(90deg);}
  .burger.is-active span:nth-child(1){transform:translateY(6.5px) rotate(45deg) !important;}
  .burger.is-active span:nth-child(2){opacity:0 !important;transform:scaleX(.2) !important;}
  .burger.is-active span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg) !important;}

  .menu-close{color:#333333 !important;transform:rotate(0deg);}
  .menu-close svg{width:17px !important;height:17px !important;transition:transform .48s cubic-bezier(.16,.8,.24,1);}
  .menu-overlay.open .menu-close{animation:menuBoxIn .55s cubic-bezier(.16,.8,.24,1) both;}
  .menu-overlay.menu-leaving .menu-close{transform:rotate(90deg);}
  .menu-overlay.menu-leaving .menu-close svg{transform:rotate(-90deg) scale(.8);}
  @keyframes menuBoxIn{from{opacity:0;transform:rotate(-90deg) scale(.92);}to{opacity:1;transform:rotate(0deg) scale(1);}}

  /* About section under Work. */
  .about-section{
    min-height:100vh;
    padding:116px 40px 72px;
    background:#151515;
    color:#f3f1ea;
    border-top:1px solid rgba(255,255,255,.16);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    overflow:hidden;
  }
  .about-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.5;margin-bottom:72px;display:block;}
  .about-title{font-size:clamp(52px,7.8vw,138px);line-height:.9;letter-spacing:-.055em;font-weight:700;max-width:1500px;}
  .about-title span{display:block;transition:transform .65s cubic-bezier(.16,.8,.24,1);}
  .about-title:hover span:nth-child(2){transform:translateX(3vw);}
  .about-title:hover span:nth-child(3){transform:translateX(6vw);}
  .about-bottom{margin-top:110px;padding-top:28px;border-top:1px solid rgba(255,255,255,.16);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.6fr);gap:64px;}
  .about-copy{max-width:760px;font-size:clamp(18px,1.8vw,30px);line-height:1.35;letter-spacing:-.02em;}
  .about-meta{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .about-meta>div{border-top:1px solid rgba(255,255,255,.16);padding-top:12px;}
  .about-meta .k{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.45;margin-bottom:8px;}
  .about-meta .v{display:block;font-size:15px;font-weight:700;line-height:1.25;}
  body.inverted .about-section{background:#f4f2ed;color:#222;border-color:rgba(0,0,0,.16);}
  body.inverted .about-bottom,body.inverted .about-meta>div{border-color:rgba(0,0,0,.16);}
  @media(max-width:900px){.about-section{padding:96px 24px 64px}.about-label{margin-bottom:48px}.about-bottom{grid-template-columns:1fr;gap:44px;margin-top:80px}}
  @media(max-width:600px){.about-title{font-size:clamp(44px,14vw,72px)}.about-meta{grid-template-columns:1fr}}
  @media(prefers-reduced-motion:reduce){.burger,.burger span,.menu-close,.menu-close svg,.menu-overlay,.hero-title-img,.about-title span{transition:none !important;animation:none !important}}
  /* FINAL PORTFOLIO REFINEMENTS END */
'''

          # Replace our own prior override if rerun, otherwise append before </style>.
          text = re.sub(r'\n?  /\* FINAL PORTFOLIO REFINEMENTS START \*/.*?/\* FINAL PORTFOLIO REFINEMENTS END \*/\n?', '\n', text, flags=re.S)
          if '</style>' not in text:
              raise SystemExit('No closing style tag')
          text = text.replace('</style>', css + '\n</style>', 1)

          about_html = '''<section id="about" class="about-section">
  <div>
    <span class="about-label">About</span>
    <h2 class="about-title">
      <span>Building digital</span>
      <span>experiences with</span>
      <span>clarity and impact.</span>
    </h2>
  </div>
  <div class="about-bottom">
    <p class="about-copy">I create digital experiences where brand, interaction and visual detail work together as one system.</p>
    <div class="about-meta">
      <div><span class="k">Based in</span><span class="v">Seoul, KR</span></div>
      <div><span class="k">Focus</span><span class="v">Digital / Brand / Experience</span></div>
    </div>
  </div>
</section>'''

          # Replace any existing about section regardless of its old class/content.
          about_pattern = r'<section\b[^>]*\bid=["\']about["\'][^>]*>.*?</section>'
          if re.search(about_pattern, text, flags=re.S|re.I):
              text = re.sub(about_pattern, about_html, text, count=1, flags=re.S|re.I)
          else:
              # Put About immediately before Contact when possible.
              contact = re.search(r'<section\b[^>]*\bid=["\']contact["\']', text, flags=re.I)
              if contact:
                  text = text[:contact.start()] + about_html + '\n\n' + text[contact.start():]
              elif '</body>' in text:
                  text = text.replace('</body>', about_html + '\n</body>', 1)
              else:
                  raise SystemExit('Could not place About section')

          script = r'''
<script id="portfolio-final-interactions">
(() => {
  const menu = document.querySelector('.menu-overlay');
  const oldBurger = document.querySelector('.burger');
  const oldClose = document.querySelector('.menu-close');
  if (!menu || !oldBurger || !oldClose) return;

  // Clone controls to remove earlier click handlers and make this behavior deterministic.
  const burger = oldBurger.cloneNode(true);
  oldBurger.replaceWith(burger);
  const closeBtn = oldClose.cloneNode(true);
  oldClose.replaceWith(closeBtn);

  const openMenu = () => {
    menu.classList.remove('menu-leaving');
    burger.classList.add('is-active');
    requestAnimationFrame(() => menu.classList.add('open'));
  };
  const closeMenu = () => {
    menu.classList.add('menu-leaving');
    burger.classList.remove('is-active');
    window.setTimeout(() => {
      menu.classList.remove('open','menu-leaving');
    }, 300);
  };

  burger.addEventListener('click', () => menu.classList.contains('open') ? closeMenu() : openMenu());
  closeBtn.addEventListener('click', closeMenu);

  // Menu section links move on the same page, including About.
  menu.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      const target = document.querySelector(a.getAttribute('href'));
      if (!target) return;
      e.preventDefault();
      closeMenu();
      window.setTimeout(() => target.scrollIntoView({behavior:'smooth',block:'start'}), 220);
    });
  });
})();
</script>
'''
          text = re.sub(r'<script id="portfolio-final-interactions">.*?</script>\s*', '', text, flags=re.S)
          if '</body>' not in text:
              raise SystemExit('No closing body tag')
          text = text.replace('</body>', script + '\n</body>', 1)

          path.write_text(text)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply theme menu interaction and About section"
          git push
